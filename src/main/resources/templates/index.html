<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro - Your Premier Events Partner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- Welcome Section -->
    <header>
        <div class="container">
            <h1>EventPro</h1>
            <p>Creating Unforgettable Experiences, One Event at a Time</p>
        </div>
    </header>

    <!-- Events Section -->
    <main>
        <div class="container">
            <h2>Upcoming Events</h2>
            <div class="events-container">
                <!-- Event Cards Loop -->
                <div class="event-card" th:each="event : ${events}">
                    <h3 th:text="${event.name}">Event Name</h3>
                    <div class="event-date" th:text="${event.date}">Event Date</div>
                    <div class="event-location" th:text="${event.location}">Event Location</div>
                    <p class="event-description" th:text="${event.description}">Event Description</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Contact Section -->
    <footer>
        <div class="container">
            <h2>Contact Us</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <strong>Email:</strong> <a href="mailto:info@eventpro.com">info@eventpro.com</a>
                </div>
                <div class="contact-item">
                    <strong>Phone:</strong> <a href="tel:+15551234567">+1 (555) 123-4567</a>
                </div>
                <div class="contact-item">
                    <strong>Address:</strong> 123 Event Plaza, Suite 500, Downtown City, ST 12345
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
